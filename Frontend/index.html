<!DOCTYPE html>
<html lang="es">
<head>

    <title>Mis Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mis Tareas</h1>

        <div id="listaTareas"></div>

    <script src="script.js"></script>

</html>
